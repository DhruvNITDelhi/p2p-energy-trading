<!DOCTYPE html>
<html>
<head>
    <title>EnergyConnect Pro | Live P2P Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans p-6 md:p-12">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-4xl font-black text-emerald-400 tracking-tighter">ENERGY-P2P <span class="text-slate-500 text-xl font-light">v2.0</span></h1>
                <p class="text-slate-500 text-sm mt-1">Hyperledger Fabric Enterprise Network</p>
            </div>
            <div class="text-right flex items-center space-x-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-emerald-500">Node Online</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
                <h3 class="text-slate-400 font-bold text-xs uppercase mb-6">Prosumer: Alice (node1)</h3>
                <div class="flex justify-between">
                    <div><p class="text-5xl font-light text-white" id="alice-energy">--</p><p class="text-slate-500 text-xs">kWh</p></div>
                    <div class="text-right"><p class="text-3xl font-bold text-emerald-400" id="alice-tokens">--</p><p class="text-slate-500 text-xs">Tokens</p></div>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-xl">
                <h3 class="text-slate-400 font-bold text-xs uppercase mb-6">Consumer: Bob (node2)</h3>
                <div class="flex justify-between">
                    <div><p class="text-5xl font-light text-white" id="bob-energy">--</p><p class="text-slate-500 text-xs">kWh</p></div>
                    <div class="text-right"><p class="text-3xl font-bold text-emerald-400" id="bob-tokens">--</p><p class="text-slate-500 text-xs">Tokens</p></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <h2 class="text-emerald-500 font-bold mb-4 flex items-center">⚡ P2P Trade</h2>
                <div class="flex space-x-4 mb-4">
                    <input type="number" id="trade-amount" value="5" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-white w-full" placeholder="kWh Amount">
                </div>
                <button onclick="executeTrade()" id="trade-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all">
                    AUTHORIZE TRADE
                </button>
                <p id="trade-status" class="mt-4 text-center text-xs text-slate-500 h-4"></p>
            </div>

            <div class="bg-slate-900 border border-purple-900/50 rounded-3xl p-6 relative overflow-hidden">
                <h2 class="text-purple-400 font-bold mb-4 flex items-center">🛡️ Admin Gateway (Recharge)</h2>
                <div class="flex space-x-2 mb-4">
                    <select id="recharge-user" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-white w-1/2">
                        <option value="node1">Alice</option>
                        <option value="node2">Bob</option>
                    </select>
                    <input type="number" id="recharge-amount" value="50" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-white w-1/2" placeholder="Tokens/kWh">
                </div>
                <button onclick="executeRecharge()" id="recharge-btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition-all">
                    MINT RESOURCES
                </button>
                <p id="recharge-status" class="mt-4 text-center text-xs text-slate-500 h-4"></p>
            </div>
        </div>
    </div>

    <script>
        const API = "http://localhost:3000/api";
        const TOKEN = "EnergyAdmin2026";

        async function refreshData() {
            for (let id of ['node1', 'node2']) {
                const res = await fetch(`${API}/node/${id}`);
                if(res.ok) {
                    const data = await res.json();
                    const prefix = id === 'node1' ? 'alice' : 'bob';
                    document.getElementById(`${prefix}-energy`).innerText = data.EnergyBalance;
                    document.getElementById(`${prefix}-tokens`).innerText = data.TokenBalance;
                }
            }
        }

        async function executeTrade() {
            const status = document.getElementById('trade-status');
            const amount = document.getElementById('trade-amount').value;
            status.innerText = "Processing Trade...";
            try {
                const res = await fetch(`${API}/trade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
                    body: JSON.stringify({ seller: "node1", buyer: "node2", energy: amount, tokens: amount * 2 })
                });
                status.innerText = res.ok ? "✅ Block Committed!" : "❌ Rejected (Insufficient Funds)";
                if(res.ok) setTimeout(refreshData, 500);
            } catch (e) { status.innerText = "Network Error"; }
        }

        async function executeRecharge() {
            const status = document.getElementById('recharge-status');
            const user = document.getElementById('recharge-user').value;
            const amount = document.getElementById('recharge-amount').value;
            status.innerText = "Minting on Ledger...";
            try {
                const res = await fetch(`${API}/recharge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
                    body: JSON.stringify({ id: user, energy: amount, tokens: amount })
                });
                status.innerText = res.ok ? "✅ Recharge Successful!" : "❌ Blockchain Error";
                if(res.ok) setTimeout(refreshData, 500);
            } catch (e) { status.innerText = "Network Error"; }
        }

        setInterval(refreshData, 5000);
        refreshData();
    </script>
</body>
</html>
