<!DOCTYPE html>
<html>
<head>
    <title>EnergyConnect Pro | Order Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans p-6 md:p-12">
    <div class="max-w-6xl mx-auto">

        <!-- HEADER -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <h1 class="text-4xl font-black text-emerald-400">ENERGY-DEX <span class="text-slate-500 text-xl font-light">v4.0</span></h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="welcome-msg" class="text-slate-400 text-sm font-bold"></span>
                <button onclick="logout()" class="text-red-400 text-xs border border-red-900/50 p-2 rounded hover:bg-red-900/20">LOGOUT</button>
            </div>
        </header>

        <!-- LOGIN SCREEN -->
        <div id="login-section" class="max-w-md mx-auto mt-20 bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6 text-center">Login to Trade</h2>
            <div class="space-y-4">
                <input type="text" id="login-user" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white" placeholder="Username (e.g. node1)">
                <input type="password" id="login-pass" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white" placeholder="Password">
                <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all">LOGIN</button>
                <div class="flex justify-between items-center text-xs text-slate-500 mt-4">
                    <span>New here?</span>
                    <button onclick="register()" class="text-emerald-400 hover:text-emerald-300">Create Account</button>
                </div>
                <p id="login-status" class="text-center text-red-500 text-sm h-4"></p>
            </div>
        </div>

        <!-- DASHBOARD (Hidden) -->
        <div id="dashboard-section" class="hidden">

            <!-- WALLET CARD -->
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-8">
                <h3 class="text-slate-400 font-bold text-xs uppercase mb-4">My Wallet</h3>
                <div class="flex justify-between border-b border-slate-800 pb-3 mb-3">
                    <div><p class="text-4xl text-white font-bold" id="my-energy">--</p><p class="text-[10px] text-slate-500 uppercase tracking-widest">Available kWh</p></div>
                    <div class="text-right"><p class="text-4xl text-emerald-400 font-bold" id="my-tokens">--</p><p class="text-[10px] text-slate-500 uppercase tracking-widest">Available ₮</p></div>
                </div>
                <div class="flex justify-between text-xs font-mono text-amber-500/80">
                    <p>🔒 <span id="my-locked-energy">0</span> kWh Escrow</p>
                    <p>🔒 <span id="my-locked-tokens">0</span> ₮ Escrow</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- ORDER FORM -->
                <div class="col-span-1 flex flex-col gap-6">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                        <h2 class="text-white font-bold mb-6">Place Limit Order</h2>
                        <select id="order-type" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white mb-4">
                            <option value="BUY">Buy Energy (Bid)</option>
                            <option value="SELL">Sell Energy (Ask)</option>
                        </select>
                        <input type="number" id="order-qty" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white mb-4" placeholder="Quantity (kWh)">
                        <input type="number" id="order-price" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white mb-6" placeholder="Price per kWh (₮)">

                        <button onclick="placeOrder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all">SUBMIT ORDER</button>
                        <p id="order-status" class="mt-4 text-center text-xs text-slate-500 h-4"></p>
                    </div>

                    <!-- RECHARGE (Admin) -->
                    <div class="bg-slate-900 border border-purple-900/50 rounded-3xl p-6 shadow-[0_0_15px_rgba(168,85,247,0.15)]">
                        <h2 class="text-purple-400 font-bold mb-4 flex items-center">🛡️ Admin Recharge</h2>
                        <input type="text" id="recharge-target" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white mb-4" placeholder="Target User ID">
                        <input type="number" id="recharge-amount" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-white mb-6" placeholder="Amount (Tokens/kWh)">
                        <button onclick="executeRecharge()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition-all">MINT RESOURCES</button>
                        <p id="recharge-status" class="mt-4 text-center text-xs text-slate-500 h-4"></p>
                    </div>
                </div>

                <!-- ORDER BOOK -->
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 col-span-2">
                    <h2 class="text-white font-bold mb-6">Live Order Book (Off-Chain Matcher)</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <h3 class="text-emerald-500 text-xs font-bold mb-2 uppercase border-b border-slate-800 pb-2">Bids (Buying)</h3>
                            <div class="grid grid-cols-2 text-[10px] text-slate-500 mb-2"><span class="text-left">QTY</span><span class="text-right">PRICE</span></div>
                            <div id="bids-list" class="space-y-1"></div>
                        </div>
                        <div>
                            <h3 class="text-red-500 text-xs font-bold mb-2 uppercase border-b border-slate-800 pb-2">Asks (Selling)</h3>
                            <div class="grid grid-cols-2 text-[10px] text-slate-500 mb-2"><span class="text-left">PRICE</span><span class="text-right">QTY</span></div>
                            <div id="asks-list" class="space-y-1"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HISTORY -->
            <div class="mt-8 bg-slate-900 border border-slate-800 rounded-3xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-white font-bold">My Transaction History</h2>
                    <button onclick="fetchHistory()" class="text-xs text-slate-500 hover:text-white">Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-400">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-950/50">
                            <tr><th class="p-3">Timestamp</th><th class="p-3">Tx ID</th><th class="p-3">Energy</th><th class="p-3">Tokens</th></tr>
                        </thead>
                        <tbody id="history-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "http://localhost:3000/api";
        let TOKEN = localStorage.getItem('token');
        let USERNAME = localStorage.getItem('username');

        // --- AUTH ---
        if(TOKEN && USERNAME) showDashboard();

        async function register() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const status = document.getElementById('login-status');
            if(!u || !p) { status.innerText = "Enter credentials"; return; }

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                status.innerText = res.ok ? "✅ Registered! Please Login." : `❌ ${data.error}`;
                status.className = res.ok ? "text-center text-emerald-500 text-sm h-4" : "text-center text-red-500 text-sm h-4";
            } catch(e) { status.innerText = "Network Error"; }
        }

        async function login() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const status = document.getElementById('login-status');

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if(res.ok) {
                    TOKEN = data.token;
                    USERNAME = data.username;
                    localStorage.setItem('token', TOKEN);
                    localStorage.setItem('username', USERNAME);
                    showDashboard();
                } else {
                    status.innerText = `❌ ${data.error}`;
                }
            } catch(e) { status.innerText = "Network Error"; }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Welcome, ${USERNAME}`;
            startPolling();
        }

        // --- DATA FETCHING ---
        async function fetchWithAuth(url, options = {}) {
            if(!options.headers) options.headers = {};
            options.headers['Authorization'] = `Bearer ${TOKEN}`;
            const res = await fetch(url, options);
            if(res.status === 401 || res.status === 403) logout();
            return res;
        }

        async function refreshData() {
            if(!TOKEN) return;

            // 1. Get My Balance
            const res = await fetchWithAuth(`${API}/node/me`);
            if(res.ok) {
                const data = await res.json();
                document.getElementById('my-energy').innerText = data.EnergyBalance;
                document.getElementById('my-tokens').innerText = data.TokenBalance;
                document.getElementById('my-locked-energy').innerText = data.LockedEnergy || 0;
                document.getElementById('my-locked-tokens').innerText = data.LockedTokens || 0;
            }

            // 2. Get Order Book (Public)
            const resOB = await fetch(`${API}/orderbook`);
            if(resOB.ok) {
                const orders = await resOB.json();
                const bids = orders.filter(o => o.OrderType === 'BUY').sort((a,b) => b.price - a.price);
                const asks = orders.filter(o => o.OrderType === 'SELL').sort((a,b) => a.price - b.price);

                document.getElementById('bids-list').innerHTML = bids.map(b => `<div class="grid grid-cols-2 text-sm text-emerald-400 bg-emerald-500/10 p-1 rounded"><span class="text-left">${b.quantity}</span><span class="text-right font-bold">${b.price}</span></div>`).join('');
                document.getElementById('asks-list').innerHTML = asks.map(a => `<div class="grid grid-cols-2 text-sm text-red-400 bg-red-500/10 p-1 rounded"><span class="text-left font-bold">${a.price}</span><span class="text-right">${a.quantity}</span></div>`).join('');
            }
        }

        async function placeOrder() {
            const status = document.getElementById('order-status');
            const type = document.getElementById('order-type').value;
            const qty = document.getElementById('order-qty').value;
            const price = document.getElementById('order-price').value;

            status.innerText = "Processing...";
            try {
                const res = await fetchWithAuth(`${API}/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: "ord_" + Math.random().toString(36).substr(2, 9),
                        orderType: type,
                        price: price,
                        quantity: qty
                    })
                });
                const data = await res.json();
                status.innerText = res.ok ? "✅ Placed" : `❌ ${data.error || 'Failed'}`;
                if(res.ok) setTimeout(refreshData, 500);
            } catch (e) { status.innerText = "Network Error"; }
        }

        async function executeRecharge() {
            const status = document.getElementById('recharge-status');
            const target = document.getElementById('recharge-target').value;
            const amount = document.getElementById('recharge-amount').value;
            status.innerText = "Minting...";
            try {
                const res = await fetchWithAuth(`${API}/recharge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: target, amount: amount })
                });
                status.innerText = res.ok ? "✅ Done" : "❌ Error (Admin Only)";
                if(res.ok) setTimeout(refreshData, 500);
            } catch (e) { status.innerText = "Network Error"; }
        }

        async function fetchHistory() {
            if(!USERNAME) return;
            const res = await fetchWithAuth(`${API}/history/${USERNAME}`);
            if(res.ok) {
                let data = await res.json();
                data.sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));
                document.getElementById('history-list').innerHTML = data.map(h => `
                    <tr class="border-b border-slate-800/50 hover:bg-slate-800/80 transition-colors">
                        <td class="p-4 whitespace-nowrap">
                            <span class="text-xs text-slate-400 font-medium block">${h.Timestamp.replace('T', ' ').substring(0, 19)}</span>
                            <span class="text-[10px] text-blue-400 font-mono mt-1 block">${h.Record.LastAction || 'Legacy Record'}</span>
                        </td>
                        <td class="p-4 font-mono text-xs text-slate-500" title="${h.TxId}">${h.TxId.substring(0, 12)}...</td>
                        <td class="p-4"><span class="text-white font-bold text-sm">${h.Record.EnergyBalance}</span></td>
                        <td class="p-4"><span class="text-white font-bold text-sm">${h.Record.TokenBalance}</span></td>
                    </tr>
                `).join('');
            }
        }

        function startPolling() {
            refreshData();
            fetchHistory();
            setInterval(refreshData, 3000);
        }
    </script>
</body>
</html>
